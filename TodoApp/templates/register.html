
{% extends 'layout.html' %}

{% block content %}
<div class="container">
    <div class="card text-center">
        <div class="card-header">
            Your Todos
        </div>

        <div class="card-body">
            <h5 class="card-title">List of Todos</h5>
            <p class="card-text">Information needs to be complete</p>

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Info</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for todo in todos %}
                    <tr class="{% if todo.complete %}alert alert-success{% else %}pointer{% endif %}">
                        <td>{{ loop.index }}</td>

                        <td class="{% if todo.complete %}strike-through-td{% endif %}">
                            {{ todo.title }}
                        </td>

                        <td>
                            <button
                                onclick="window.location.href='/todos/edit-todo-page/{{ todo.id }}'"
                                type="button"
                                class="btn btn-info"
                            >
                                Edit
                            </button>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3">No todos found. Add your first todo!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="/todos/add-todo-page" class="btn btn-primary">
                Add a new todo!
            </a>
        </div>
    </div>
</div>
{% endblock %}
