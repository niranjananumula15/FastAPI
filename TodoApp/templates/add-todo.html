
{% extends 'layout.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            Make a new todo
        </div>

        <div class="card-body">
            <form id="todoForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        class="form-control"
                        id="description"
                        rows="3"
                        name="description"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select
                        class="form-control"
                        id="priority"
                        name="priority"
                        required
                    >
                        <option value="5">High</option>
                        <option value="3" selected>Medium</option>
                        <option value="1">Low</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add new todo
                </button>

                <a href="/todos/todo-page" class="btn btn-success">
                    Back
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
