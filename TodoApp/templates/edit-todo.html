
{% extends 'layout.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            Edit your Todo
        </div>

        <div class="card-body">
            <form id="editTodoForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        value="{{ todo.title }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="3"
                        required
                    >{{ todo.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select
                        id="priority"
                        name="priority"
                        class="form-control"
                        required
                    >
                        <option value="5" {% if todo.priority == 5 %}selected{% endif %}>High</option>
                        <option value="3" {% if todo.priority == 3 %}selected{% endif %}>Medium</option>
                        <option value="1" {% if todo.priority == 1 %}selected{% endif %}>Low</option>
                    </select>
                </div>

                <div class="form-group form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="complete"
                        name="complete"
                        {% if todo.complete %}checked{% endif %}
                    >
                    <label class="form-check-label" for="complete">
                        Complete
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Edit your todo
                </button>

                <button id="deleteTodo" type="button" class="btn btn-danger">
                    Delete
                </button>

                <a href="/todos/todo-page" class="btn btn-success">
                    Back
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
