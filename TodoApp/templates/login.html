
{% extends 'layout.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Login</h1>
        </div>

        <div class="card-body">
            <div id="message" class="alert d-none"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Login
                </button>
            </form>
        </div>

        <div class="card-footer text-muted">
            <a href="/auth/register-page">Register?</a>
        </div>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.target;
    const message = document.getElementById("message");
    const formData = new FormData(form);

    message.className = "alert d-none";
    message.textContent = "";

    const body = new URLSearchParams();
    body.append("username", formData.get("username"));
    body.append("password", formData.get("password"));

    try {
        const response = await fetch("/auth/token", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: body.toString()
        });

        const result = await response.json();

        if (!response.ok) {
            message.className = "alert alert-danger";
            message.textContent = result.detail || "Login failed.";
            return;
        }

        document.cookie = "access_token=" + encodeURIComponent(result.access_token)
            + "; path=/; SameSite=Lax";

        window.location.href = "/todos/todo-page";

    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = "Unable to connect to the server.";
    }
});
</script>
{% endblock %}
